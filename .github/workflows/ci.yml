name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check norma
      - name: Test
        run: pytest -q

  smoke-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Export to every ecosystem format
        run: |
          printf 'country,continent\nJapan,Asia\nJapan,Asia\nKenya,Africa\n' > /tmp/t.csv
          for fmt in great_expectations pandera dbt sql_check json_schema frictionless metanome shacl; do
            norma export /tmp/t.csv --to $fmt --out /tmp/out/$fmt --learner discrete
          done
